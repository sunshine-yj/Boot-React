spring.application.name=mallapi

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3307/malldb
spring.datasource.username=malldbuser
spring.datasource.password=malldbuser

# 엔티티를 보고 테이블을 만들거나 고침
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 콘솔에 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Boot 4 전용: JSON에 없는 boolean/int 필드를 기본값(false/0)으로 받기
spring.jackson.deserialization.fail-on-null-for-primitives=false